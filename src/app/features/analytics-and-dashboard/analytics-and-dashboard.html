<div class="analytics-container">
  <h2>Analytics & Insights Dashboard</h2>
  <p class="subtitle">Comprehensive analytics with fraud trends and predictive insights</p>

  <div class="grid-2">
    <div class="box">
      <h4>Transaction Status Breakdown</h4>
      <canvas id="fraudTrends"></canvas> 
    </div>
    <div class="box">
      <h4>Risk Level Distribution</h4>
      <canvas id="riskChart"></canvas>
    </div>
  </div>

  <div class="grid-2">
    <div class="box">
      <h4>Alert Severity Over Time</h4>
      <canvas id="transactionVolume"></canvas>
    </div>
    <div class="card channel-performance">
      <h4>Transaction Volume by Channel</h4>
      <p class="subtitle">Activity across different banking channels</p>
      <canvas id="channelPerformanceChart"></canvas>
    </div>
  </div>
</div>
