<div class="onboarding-container">
  <div class="header">
    <h2>Customer Onboarding & KYC</h2>
    <button class="primary-btn" (click)="goToNewOnboarding()">+ New Onboarding</button>
  </div>
 
  <table class="onboarding-table">
    <thead>
      <tr>
        <th>Application ID</th>
        <th>Customer Name</th>
        <th>Mobile</th>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </thead>
 
    <tbody>
      <tr *ngFor="let app of applications">
        <td>{{ app.applicationId }}</td>
        <td>{{ app.name }}</td>
        <td>{{ app.mobile }}</td>
        <td>{{ app.date }}</td>
        <td>
          <span class="status"
                [ngClass]="app.status.toLowerCase()">
            {{ app.status }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
