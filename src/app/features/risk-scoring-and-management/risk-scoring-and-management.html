<div class="risk-container">
  <h2>Risk & Alert Management</h2>
  <p class="subtitle">
    Real-time threat detection and automated risk monitoring
  </p>

  <div class="summary">
     </div>
  
  <table class="alerts-table">
    <thead>
      <tr>
        <th>Alert ID</th>
        <th>Type</th>
        <th>Customer</th>
        <th>Severity</th>
        <th>Timestamp</th>
        
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let alert of filteredAlerts">
        <td>{{ alert.id }}</td> <td>{{ alert.type }}</td>
        <td>{{ alert.customer }}</td>
        <td>
          <span class="badge" [ngClass]="alert.severity.toLowerCase()">
            {{ alert.severity }}
          </span>
        </td>
        <td>{{ alert.timestamp | date:'short' }}</td>
        
      </tr>
    </tbody>
  </table>
</div>
