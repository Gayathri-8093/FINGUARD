<div class="login-container">
<div class="login-card">
    <img src="public/images/Image.jpg" alt="FinGuard Logo" class="logo"/>
<h2>FinGuard</h2>
<p class="subtitle">Fraud Detection & Risk Management System</p>
<input
     type="email"
     placeholder="Enter your email"
     [(ngModel)]="email"
   />
<input
     type="password"
     placeholder="Enter your password"
     [(ngModel)]="password"
   />
<button (click)="login()">Sign In</button>
<div class="demo">
<p><b>Banker:</b> banker@finguard.com / banker123</p>
<p><b>Admin:</b> admin@finguard.com / admin123</p>
</div>
</div>
</div>
